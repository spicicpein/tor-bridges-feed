name: update-bridges

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read moat-settings README and config
        run: |
          set -e
          PROJECT="tpo%2Fapplications%2Ftor-browser-build"
          echo "--- README.md ---" > fetch-debug.log
          curl -sL "https://gitlab.torproject.org/api/v4/projects/${PROJECT}/repository/files/projects%2Fmoat-settings%2FREADME.md/raw?ref=main" >> fetch-debug.log 2>&1
          echo "" >> fetch-debug.log
          echo "--- config ---" >> fetch-debug.log
          curl -sL "https://gitlab.torproject.org/api/v4/projects/${PROJECT}/repository/files/projects%2Fmoat-settings%2Fconfig/raw?ref=main" >> fetch-debug.log 2>&1
          echo "" >> fetch-debug.log
          echo "--- build ---" >> fetch-debug.log
          curl -sL "https://gitlab.torproject.org/api/v4/projects/${PROJECT}/repository/files/projects%2Fmoat-settings%2Fbuild/raw?ref=main" >> fetch-debug.log 2>&1

      - name: Parse and write bridges.json
        run: python3 scripts/parse_bridges.py

      - name: Commit if changed
        run: |
          git config user.email "actions@github.com"
          git config user.name "bridge-feed-bot"
          git add bridges.json fetch-debug.log
          git diff --cached --quiet && echo "no changes" || (git commit -m "update bridges $(date -u +%Y-%m-%d)" && git push)
