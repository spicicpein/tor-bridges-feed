name: update-bridges

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and parse current default bridges
        run: |
          set -e
          URL="https://gitweb.torproject.org/builders/tor-browser-build.git/plain/projects/tor-browser/Bundle-Data/PTConfigs/bridge_prefs.js"
          curl -sL -o bridge_prefs.js "$URL" || true
          echo "--- fetched file (first 40 lines) ---"
          head -40 bridge_prefs.js || true
          python3 - << 'PYEOF'
import json, re, datetime

try:
    with open("bridge_prefs.js", encoding="utf-8", errors="ignore") as f:
        content = f.read()
except FileNotFoundError:
    content = ""

lines = re.findall(r'"((?:obfs4|webtunnel) [^"]+)"', content)
seen = set()
bridges = []
for l in lines:
    if l not in seen:
        seen.add(l)
        bridges.append(l)

feed = {
    "updated": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
    "source_fetch_ok": len(content) > 0,
    "bridges": bridges,
}
with open("bridges.json", "w") as f:
    json.dump(feed, f, indent=2)
print(f"wrote {len(bridges)} bridge lines, source_fetch_ok={len(content) > 0}")
PYEOF
          rm -f bridge_prefs.js

      - name: Commit if changed
        run: |
          git config user.email "actions@github.com"
          git config user.name "bridge-feed-bot"
          git add bridges.json
          git diff --cached --quiet && echo "no changes" || (git commit -m "update bridges $(date -u +%Y-%m-%d)" && git push)
