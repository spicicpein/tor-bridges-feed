name: update-bridges

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Explore moat-settings project
        run: |
          set -e
          PROJECT="tpo%2Fapplications%2Ftor-browser-build"
          echo "--- projects/moat-settings/ ---" > fetch-debug.log
          curl -sL "https://gitlab.torproject.org/api/v4/projects/${PROJECT}/repository/tree?path=projects/moat-settings&per_page=100" >> fetch-debug.log 2>&1
          echo "" >> fetch-debug.log
          echo "--- also check for a 'moat' or 'rdsys' or 'bridgedb' standalone project ---" >> fetch-debug.log
          curl -sL "https://gitlab.torproject.org/api/v4/groups/tpo/projects?search=settings&per_page=50" >> fetch-debug.log 2>&1

      - name: Parse and write bridges.json
        run: python3 scripts/parse_bridges.py

      - name: Commit if changed
        run: |
          git config user.email "actions@github.com"
          git config user.name "bridge-feed-bot"
          git add bridges.json fetch-debug.log
          git diff --cached --quiet && echo "no changes" || (git commit -m "update bridges $(date -u +%Y-%m-%d)" && git push)
