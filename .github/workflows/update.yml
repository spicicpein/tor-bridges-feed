name: update-bridges

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current default bridges
        run: |
          set -e
          URL="https://gitweb.torproject.org/builders/tor-browser-build.git/plain/projects/tor-browser/Bundle-Data/PTConfigs/bridge_prefs.js"
          curl -sL -o bridge_prefs.js "$URL" || true
          echo "--- fetched file (first 40 lines) ---"
          head -40 bridge_prefs.js || true

      - name: Parse and write bridges.json
        run: python3 scripts/parse_bridges.py

      - name: Cleanup
        run: rm -f bridge_prefs.js

      - name: Commit if changed
        run: |
          git config user.email "actions@github.com"
          git config user.name "bridge-feed-bot"
          git add bridges.json
          git diff --cached --quiet && echo "no changes" || (git commit -m "update bridges $(date -u +%Y-%m-%d)" && git push)
