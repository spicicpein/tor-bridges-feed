name: update-bridges

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch circumvention.json from rdsys-admin
        run: |
          set -e
          PROJECT="tpo%2Fanti-censorship%2Frdsys-admin"
          echo "--- project default branch ---" > fetch-debug.log
          curl -sL "https://gitlab.torproject.org/api/v4/projects/${PROJECT}" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('default_branch'))" >> fetch-debug.log 2>&1
          echo "--- conf/circumvention.json (first 3000 chars) ---" >> fetch-debug.log
          curl -sL "https://gitlab.torproject.org/api/v4/projects/${PROJECT}/repository/files/conf%2Fcircumvention.json/raw?ref=main" -o circumvention.json 2>&1
          head -c 3000 circumvention.json >> fetch-debug.log

      - name: Parse and write bridges.json
        run: python3 scripts/parse_bridges.py

      - name: Commit if changed
        run: |
          git config user.email "actions@github.com"
          git config user.name "bridge-feed-bot"
          git add bridges.json fetch-debug.log
          git diff --cached --quiet && echo "no changes" || (git commit -m "update bridges $(date -u +%Y-%m-%d)" && git push)
