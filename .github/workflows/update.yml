name: update-bridges

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Explore repo structure
        run: |
          set -e
          PROJECT="tpo%2Fapplications%2Ftor-browser-build"
          echo "--- project info (default branch) ---" > fetch-debug.log
          curl -sL "https://gitlab.torproject.org/api/v4/projects/${PROJECT}" | python3 -c "import json,sys; d=json.load(sys.stdin); print('default_branch:', d.get('default_branch'))" >> fetch-debug.log 2>&1 || true
          echo "--- root tree ---" >> fetch-debug.log
          curl -sL "https://gitlab.torproject.org/api/v4/projects/${PROJECT}/repository/tree?per_page=100" >> fetch-debug.log 2>&1 || true
          echo "" >> fetch-debug.log
          echo "--- search for bridge_prefs anywhere in repo ---" >> fetch-debug.log
          curl -sL "https://gitlab.torproject.org/api/v4/projects/${PROJECT}/search?scope=blobs&search=bridge_prefs" >> fetch-debug.log 2>&1 || true

      - name: Parse and write bridges.json
        run: python3 scripts/parse_bridges.py

      - name: Commit if changed
        run: |
          git config user.email "actions@github.com"
          git config user.name "bridge-feed-bot"
          git add bridges.json fetch-debug.log
          git diff --cached --quiet && echo "no changes" || (git commit -m "update bridges $(date -u +%Y-%m-%d)" && git push)
